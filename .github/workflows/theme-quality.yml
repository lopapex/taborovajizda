name: Theme quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate and build theme
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Check PHP syntax
        working-directory: .
        run: find theme -path 'theme/node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHP domain tests
        working-directory: .
        run: php theme/tests/SeasonTest.php

      - name: Verify release-only files stay untracked
        working-directory: .
        run: |
          test -z "$(git ls-files 'theme/public/build/**')"
          test -z "$(git ls-files 'theme/node_modules/**')"
