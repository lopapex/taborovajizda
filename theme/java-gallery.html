<!DOCTYPE html>
<html lang='cs' dir='ltr'>
<head>
	<meta charset="utf-8" />
</head>
<body>
	<script>
		function getRandomInt(min, max) {
			min = Math.ceil(min);
			max = Math.floor(max);
			return Math.floor(Math.random() * (max - min)) + min; //The maximum is exclusive and the minimum is inclusive
		}
		
		function test_fit(x, y, shape) {
			if (shape == undefined) { return 0;}
			var value = 0;
			console.log('row0: '+surface[y]);
			console.log('row1: '+surface[y+1]);
			console.log('row2: '+surface[y+2]);
			for (var i=x; surface[y][i]==0&&i<12; i++);
			console.log('real space left: '+(i-x));
			var remaining_space_after = i - x - shape[0];
			var remaining_space_before = i - x;
			console.log('space left - before: '+remaining_space_before+' after: '+remaining_space_after);
			if (remaining_space_after >= 4) { // there is enough space to fit any shape
				value = 100; 
			} 
			else if (remaining_space_after >= 0) {
				switch (remaining_space_after) {
					case 0:
							value = 50; // last piece fits perfectly
						break;
					case 3:
						if (shape_count[4] > 0) {value = 50;} // OK solution - there exists fitting shape (55 -> get rid of vertical elements first)
						else if (shape_count[0] > 0 || shape_count[1] > 0 || shape_count[4] > 0) {value = 45;} // OK solution - there exists fitting shape
						else if (shape_count[3] > 0) {value = 25;} // Not too bad - If cropped - we got ourselves a fit
						else {value = 0}; // worst case - try different solution
						break;
					case 2:
						if (shape_count[2] > 0) {value = 50;} // OK solution - there exists fitting shape
						else if (shape_count[0] > 0) {value = 20;} // Not too bad - If resized - we got ourselves a fit
						else {value = 0;} // worst case - try different solution
						break;
					case 1:
						if (shape_count[0] > 0) {value = 20;} // Not too bad - If resized - we got ourselves a fit
						else if (shape_count[2] > 0) {value = 16;} // Not so good - If cropped and resized it fits (16 -> get rid of vertical elements first)
						else if (shape_count[4] > 0 || shape_count[3] > 0) {value = 15;} // Not so good - If cropped and resized it fits
						else {value = 0;} // worst case - try different solution
						break;
				}
				value += 50;
			}
			else {
				switch (remaining_space_before) {
					case 0:
							value = 50; // last piece fits perfectly
						break;
					case 3:
						if (shape_count[4] > 0) {value = 50;} // OK solution - there exists fitting shape (55 -> get rid of vertical elements first)
						else if (shape_count[0] > 0 || shape_count[1] > 0 || shape_count[4] > 0) {value = 45;} // OK solution - there exists fitting shape
						else if (shape_count[3] > 0) {value = 25;} // Not too bad - If cropped - we got ourselves a fit
						else {value = 0}; // worst case - try different solution
						break;
					case 2:
						if (shape_count[2] > 0) {value = 50;} // OK solution - there exists fitting shape
						else if (shape_count[0] > 0) {value = 20;} // Not too bad - If resized - we got ourselves a fit
						else {value = 0;} // worst case - try different solution
						break;
					case 1:
						if (shape_count[0] > 0) {value = 20;} // Not too bad - If resized - we got ourselves a fit
						else if (shape_count[2] > 0) {value = 16;} // Not so good - If cropped and resized it fits (16 -> get rid of vertical elements first)
						else if (shape_count[4] > 0 || shape_count[3] > 0) {value = 15;} // Not so good - If cropped and resized it fits
						else {value = 0;} // worst case - try different solution
						break;
				}
			}
			return value;
		}
		
		function add_shape(x, y, shape) {
			dy_max = shape[1]
			dx_max = (result > 25)?shape[0]:width-x;
			for (var dy = 0; dy < dy_max; dy++) {
				for (var dx = 0; dx < dx_max; dx++) {
					surface[y+dy][x+dx] = 1;
				}
			}
			shape_idx = shapes.indexOf(shape);
			shape_count[shape_idx]--;
		}
		
		var surface = [];
		var shapes = [[3,3,'',false,false], [3,2,'',false,false], [2,3,'',false,false], [4,3,'',false,false], [3,4,'',false,false]]; //basic shapes x,y dimensions, url, crop, resize
		var shape_count = [0,0,0,0,0]; 	// 0 - 3x3; 1 - 3x2; 2 - 2x3; 3 - 4x3; 4 - 3x4
		var shape_vector = []; 			// 0 - 3x3; 1 - 3x2; 2 - 2x3; 3 - 4x3; 4 - 3x4
		for (var shape = 0, i = 0; i < 20; i++, shape = getRandomInt(0,5)) { //generate 20 random shapes
			shape_vector.push(shapes[shape]);
			shape_count[shape]++;
		}
		var width = 12;
		// init the surface grid matrix
		for (var y = 0; y < 100; y++) {
			surface.push([]);
			for (var x = 0; x < width; x++) {
				surface[y].push(0);
			}
		}
		var retries = 0
		var retries_vector = [];
		var result_vector = [];
		var no_solution = false;
		var best_result = 0;
		var shape_idx = 0;
		for (var y = 0; y < 100; y++) {
			for (var x = 0; x < width; x++) {
				// is there an empty space?
				if (surface[y][x] == 0) {
					shape = shape_vector.pop();
					no_solution = (shape == undefined); //we haven't found solution and we've ran out of shapes
					result = test_fit(x,y,shape);
					result_vector.push(result);
					best_result = 0;
					if (retries > .5*shape_vector.length) {best_result = Math.max.apply(Math,result_vector);}
					console.log('result vector: '+result_vector);
					console.log('best result so far: '+best_result);
					console.log('current result: '+result);
					if (result >= 100) {
						add_shape(x,y,shape);
						retries = 0;
						shape_vector = shape_vector.concat(retries_vector);
						retries_vector = [];
						result_vector= [];
					}
					else if (best_result > 0) {
						result_idx = result_vector.indexOf(best_result);
						shape = retries_vector.slice(result_idx, result_idx+1);
						add_shape(x,y,shape);
						retries = 0;
						shape_vector = shape_vector.concat(retries_vector);
						retries_vector = [];
						result_vector = [];
					}
					else {
						retries_vector.push(shape);
						x-- // give it another go
						retries++;
					}
					if (shape_vector.length + retries_vector.length < 1 || no_solution) {
						x = y = Number.MAX_VALUE; // break out from for loops
					}
					console.log('shapes: '+shape_vector);
					console.log('retries: '+retries_vector);
				}
			}
		}

		console.log(shape_vector);
		console.log(surface);
	</script>
</body>
</html>
